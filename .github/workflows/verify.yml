name: Verify Pro Max
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm bench:typecheck
      - run: pnpm bench:test
      - if: runner.os == 'Linux'
        run: pnpm pack --pack-destination dist
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pro-max-preview
          path: dist/*.tgz
          if-no-files-found: error

# Publish and release for dsh-web-search-pro-max. Tag builds release tarballs; npm publication is explicit.
#
# Modeled on the official deepseek-harness release.yml pattern:
#   - pack runs WITHOUT registry credentials on every run — it builds, verifies
#     the tag/version match, and uploads the exact tarball bytes;
#   - publish is explicit: a manual dispatch from master or a v* tag with
#     publish=true. It consumes the packed bytes (never a rebuild) and is the
#     only step that can write to the npm registry;
#   - publish runs are serialized so two versions cannot race dist-tags.
#
# One-time setup (package owner):
#   npm package → Settings → Trusted publishing → GitHub Actions:
#   owner wxcvm, repository dsh-web-search-pro-max, workflow publish.yml,
#   environment npm-publish, with direct npm publish allowed.
#
# Trigger a release:
#   git tag v0.1.0 && git push origin v0.1.0
# or run the workflow manually with "publish" checked.

name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm from master or a matching v* tag.'
        required: true
        type: boolean
        default: false
      channel:
        description: 'npm channel: latest for normal installs; next for opt-in previews; auto by version.'
        type: choice
        options: [latest, next, auto]
        default: latest
      auth:
        description: 'First publish: bootstrap-token (repository NPM_TOKEN secret); later: trusted.'
        type: choice
        options: [trusted, bootstrap-token]
        default: trusted

permissions:
  contents: read

concurrency:
  # Pack runs per ref; publish is globally serialized (shared dist-tag state).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '22'

jobs:
  pack:
    name: Build and pack tarball
    runs-on: ubuntu-24.04
    outputs:
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        id: version
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel || 'auto' }}
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          echo "package.json version: $pkg_version"
          # On a tag push, the tag must match package.json (v0.1.0 == 0.1.0).
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$pkg_version" ]]; then
              echo "::error::tag v$tag_version does not match package.json version $pkg_version" >&2
              exit 1
            fi
          fi
          if [[ "$pkg_version" == *-* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          if [[ "$REQUESTED_CHANNEL" == latest || "$REQUESTED_CHANNEL" == next ]]; then
            dist_tag="$REQUESTED_CHANNEL"
          fi
          echo "npm dist-tag: $dist_tag"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "PKG_VERSION=$pkg_version" >> "$GITHUB_ENV"

      - name: Verify release candidate
        run: pnpm verify

      - name: Verify benchmark utilities
        run: pnpm bench:typecheck && pnpm bench:test

      - name: Pack tarball
        run: pnpm pack --pack-destination dist

      - name: Show tarball contents
        run: tar -tzf dist/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: github.event_name == 'workflow_dispatch' && inputs.publish && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write    # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist

      - name: Publish with trusted publishing
        if: inputs.auth == 'trusted'
        run: npm publish ./dist/*.tgz --provenance --access public --tag "${{ needs.pack.outputs.dist_tag }}"

      - name: First publish using bootstrap token
        if: inputs.auth == 'bootstrap-token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::NPM_TOKEN is not configured. Add a scoped granular publish token in repository Actions secrets."
            exit 1
          fi
          npm publish ./dist/*.tgz --provenance --access public --tag "${{ needs.pack.outputs.dist_tag }}"

  release:
    name: GitHub Release with tarball
    if: github.event_name == 'push'   # v* tag pushes only
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

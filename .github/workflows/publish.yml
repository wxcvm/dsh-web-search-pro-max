# Build a precompiled package and attach it to a GitHub Release.
# No npm publication, registry credentials, NPM_TOKEN, or npm account is required.

name: GitHub Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching package.json, e.g. v0.3.0-alpha.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '22'

jobs:
  release:
    name: Build, verify and attach prebuilt tarball
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release tag and package version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Manual releases must be dispatched from master."
            exit 1
          fi
          tag="$REQUESTED_TAG"
          if [[ "$tag" != v* ]]; then
            echo "::error::Release tag must start with v."
            exit 1
          fi
          tag_version="${tag#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "::error::Tag $tag does not match package.json version $pkg_version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing GitHub Release $tag for package $pkg_version"

      - name: Verify release candidate
        run: pnpm verify

      - name: Verify benchmark utilities
        run: pnpm bench:typecheck && pnpm bench:test

      - name: Pack prebuilt plugin
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          tarball=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          mv "$tarball" dist/dsh-web-search-pro-max.tgz
          tar -tzf dist/dsh-web-search-pro-max.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: master
          name: Web Search Pro Max ${{ steps.version.outputs.tag }}
          files: dist/dsh-web-search-pro-max.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
